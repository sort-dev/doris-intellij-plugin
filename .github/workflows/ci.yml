name: CI

on:
  push:
    branches: [ main, froze-over ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Test Brikk Kotlin injection
        run: ./gradlew test -Ptest.kotlin=present --tests '*BrikkDoris*'

      - name: Test Brikk on newer Kotlin runtimes
        run: ./gradlew test262 test263 -Ptest.kotlin=present

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/

  # Plugin Verifier against the IDE builds pinned in build.gradle.kts (pluginVerification.ides), on demand.
  # release/<version> pushes run the strict API verifier in release.yml before publishing.
  #
  # Treat an unresolved-class failure here skeptically: local/CI verifyPlugin once reported
  # unresolved-class problems (grid classes, build 262) that JetBrains' own Marketplace verifier
  # and a real IDE run both contradicted — likely an EAP-vs-RC target-build difference. Cross-check
  # the Marketplace verification rows (and bump the pinned IU build to the current RC) before believing it.
  verify:
    name: Plugin Verifier
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: warn
