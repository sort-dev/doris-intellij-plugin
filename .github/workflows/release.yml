name: Release

on:
  workflow_dispatch:
  push:
    branches: [ 'release/**' ]

jobs:
  release:
    permissions:
      contents: write
    uses: sort-dev/intellij-sql-plugin-gradle-conventions/.github/workflows/release-plugin-zip.yml@387c9f39bf66142cf9f07074bc340f44ae1d3801
    with:
      java-version: "25"
      plugin-id: dev.sort.doris-intellij-plugin
      title: SQL Dialect for Apache Doris
