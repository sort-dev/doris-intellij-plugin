[versions]
kotlin = "2.4.10"
intellij-platform-gradle-plugin = "2.19.0"
intellij-sdk = "2026.1.3"
intellij-since-build = "261"
intellij-until-build = "263.*"
intellij-runtime-262 = "262.10968.63"
intellij-runtime-263 = "263.5701.42"
intellij-verifier-ides = "DB-2026.1.3 IU-262.10968.63 DB-2026.2.5 IU-263.4732.28 IU-263.5701.42"
sql-transpiler-plugin = "0.3.0"
brikk-sql-core = "0.20.0"
brikk-sql-verify = "0.20.0"
brikk-sql-intellij-support = "0.2.1"
brikk-engine-kotlin-intellij-support = "0.3.0"
antlr = "4.13.2"
trino = "483"
duckdb-jdbc = "1.5.6.0"
kotlinx-serialization = "1.9.0"
junit = "4.13.2"

[libraries]
brikk-sql-jvm = { module = "dev.brikk.house:brikk-sql-jvm", version.ref = "brikk-sql-core" }
brikk-sql-metadata-jvm = { module = "dev.brikk.house:brikk-sql-metadata-jvm", version.ref = "brikk-sql-core" }
brikk-sql-verify = { module = "dev.brikk.house:brikk-sql-verify", version.ref = "brikk-sql-verify" }
brikk-sql-intellij-support = { module = "dev.brikk.house:brikk-sql-intellij-support", version.ref = "brikk-sql-intellij-support" }
brikk-sql-intellij-jdbc-support = { module = "dev.brikk.house:brikk-sql-intellij-jdbc-support", version.ref = "brikk-sql-intellij-support" }
brikk-sql-intellij-test-support = { module = "dev.brikk.house:brikk-sql-intellij-test-support", version.ref = "brikk-sql-intellij-support" }
brikk-engine-kotlin-intellij-support = { module = "dev.brikk.house:brikk-engine-kotlin-intellij-support", version.ref = "brikk-engine-kotlin-intellij-support" }
antlr4-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }
trino-parser = { module = "io.trino:trino-parser", version.ref = "trino" }
trino-jdbc = { module = "io.trino:trino-jdbc", version.ref = "trino" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb-jdbc" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
intellij-platform-gradle-plugin = { module = "org.jetbrains.intellij.platform:intellij-platform-gradle-plugin", version.ref = "intellij-platform-gradle-plugin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-sam-with-receiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "kotlin" }
