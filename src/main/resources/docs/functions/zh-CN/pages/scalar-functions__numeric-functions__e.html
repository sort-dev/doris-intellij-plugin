<div class="definition"><pre>E</pre></div>
<div class="content">
<h2>描述</h2>
<p>返回常量 <code>e</code> 值。</p>
<h2>语法</h2>
<pre><code>E()
</code></pre>
<h2>举例</h2>
<pre><code>select e();
</code></pre>
<pre><code>+-------------------+
| e()               |
+-------------------+
| 2.718281828459045 |
+-------------------+
</code></pre>
