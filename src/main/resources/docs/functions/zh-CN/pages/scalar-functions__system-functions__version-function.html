<div class="definition"><pre>VERSION</pre></div>
<div class="content">
<h2>描述</h2>
<p>无实际意义，兼容 MySQL 协议。</p>
<h2>语法</h2>
<pre><code>VERSION()
</code></pre>
<h2>返回值</h2>
<p>兼容 MySQL 协议，固定返回“5.7.99”。</p>
<h2>举例</h2>
<pre><code>select version();
</code></pre>
<pre><code>+-----------+
| version() |
+-----------+
| 5.7.99    |
+-----------+
</code></pre>
<p><a href="https://doris.apache.org/zh-CN/docs/4.x/sql-manual/sql-functions/scalar-functions/system-functions/version-function/">Apache Doris 4.x 官方中文文档</a></p>

</div>
