<div class="definition"><pre>PI</pre></div>
<div class="content">
<h2>描述</h2>
<p>返回常量<code>Pi</code>值。</p>
<h2>语法</h2>
<pre><code>PI()
</code></pre>
<h2>返回值</h2>
<p>返回一个常量 Pi，类型为浮点数</p>
<h2>举例</h2>
<pre><code>select Pi();
</code></pre>
<pre><code>+-------------------+
| pi()              |
+-------------------+
| 3.141592653589793 |
+-------------------+
</code></pre>
