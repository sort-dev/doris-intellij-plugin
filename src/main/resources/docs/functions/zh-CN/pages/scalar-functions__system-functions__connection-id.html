<div class="definition"><pre>CONNECTION_ID</pre></div>
<div class="content">
<h2>描述</h2>
<p>获取当前 sql 客户端的连接编号。</p>
<h2>语法</h2>
<pre><code>CONNECTION_ID()
</code></pre>
<h2>返回值</h2>
<p>当前 sql 客户端的连接编号。</p>
<h2>举例</h2>
<pre><code>select connection_id();
</code></pre>
<pre><code>+-----------------+
| connection_id() |
+-----------------+
|             549 |
+-----------------+
</code></pre>
